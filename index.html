<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYTU - Connect. Build. Collaborate.</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="left-section">

            <h1>SYTU</h1>

            <h2>Professional Networking Platform</h2>

            <p>
                Connect with developers, designers,
                entrepreneurs and innovators.
                Build your network, showcase projects,
                and collaborate on opportunities.
            </p>

        </div>

        <div class="right-section">

            <div class="login-card">

                <h3>Welcome Back</h3>

                <p class="subtitle">
                    Login to continue your journey
                </p>

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address">

                <input
                    type="password"
                    id="password"
                    placeholder="Password">

                <button id="loginBtn">
                    Login
                </button>

            </div>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
